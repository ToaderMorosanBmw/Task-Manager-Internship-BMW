name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/bulk-action

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./Task-Manager-Internship-BMW
        run: npm ci

      - name: Build Angular Project
        working-directory: ./Task-Manager-Internship-BMW
        run: npm run build -- --configuration production --base-href /Task-Manager-Internship-BMW/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Task-Manager-Internship-BMW/dist/task-manager-internship-bmw/browser
