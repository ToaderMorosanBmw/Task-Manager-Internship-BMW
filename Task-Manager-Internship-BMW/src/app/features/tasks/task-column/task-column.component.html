<h1>{{ title }}</h1>

<div class="column">
    @if (!cardItems || cardItems.length === 0) {
        <p class="loading">No tasks</p>
    } @else {
        @for (item of cardItems; track $index) {
            <app-task-card [task]="item" [priorityColor]="item.priority || ''"></app-task-card>
        }
    }
</div>
