@if (isLoading) {
  <div class="spinner-container">
    <mat-spinner diameter="60"></mat-spinner>
  </div>
} @else {
  <div class="top-bar">
    <div class="brand-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M11.999 1.5C11.999 1.5 11.455 10.024 3.5 11.999C11.455 13.975 11.999 22.5 11.999 22.5C11.999 22.5 12.544 13.975 20.5 11.999C12.544 10.024 11.999 1.5 11.999 1.5Z"
          />
        </svg>
      </div>
      <span class="logo-text">TaskFlow</span>
    </div>
    <div class="view-toggle" [class.is-table]="view === 'table'">
      <div class="toggle-slider"></div>
      <button class="toggle-btn" [class.active]="view === 'board'" (click)="view = 'board'">Board</button>
      <button class="toggle-btn" [class.active]="view === 'table'" (click)="view = 'table'">Table</button>
    </div>
  </div>
  <div class="middle-bar">
    <input
      type="text"
      [(ngModel)]="searchText"
      (ngModelChange)="onSearchChange()"
      placeholder="Search for tasks..."
      class="search-input"
    />
    <div class="stats">
      <div class="total">Total tasks: {{ this.allTasks.length }}</div>
      <div class="completed">
        Completed:
        {{ completedPercentage }}%
      </div>
      <div class="overdue">Overdue: {{ overdueCount }}</div>
    </div>
    <div class="left-buttons">
      <button class="add-task-btn" aria-label="Create task" (click)="onCreateTaskClick()">
        Add Task
      </button>
      <button class="csv-btn" (click)="exportToCSV()" matTooltip="Export to CSV">
        <mat-icon fontSet="material-symbols-outlined">download</mat-icon>
      </button>
    </div>
  </div>

  @if (this.view === 'board') {
    <div class="filters">
      <app-task-filter-row
        filterName="Priority"
        [buttons]="priorities"
        [selectedValue]="selectedPriority"
        (selected)="onPrioritySelected($event)"
      ></app-task-filter-row>
      <div class="vertical-line"></div>
      <app-task-filter-row
        filterName="Category"
        [buttons]="categories"
        [selectedValue]="selectedCategory"
        (selected)="onCategorySelected($event)"
      ></app-task-filter-row>
    </div>

    <div cdkDropListGroup class="columns">
      <app-task-column
        [cardItems]="todoTasks"
        title="To Do"
        (taskStausChanged)="onTaskStatusChange($event)"
        (deleted)="onTaskDeleted($event)"
      ></app-task-column>
      <app-task-column
        [cardItems]="inProgressTasks"
        title="In Progress"
        (taskStausChanged)="onTaskStatusChange($event)"
        (deleted)="onTaskDeleted($event)"
      ></app-task-column>
      <app-task-column
        [cardItems]="completedTasks"
        title="Completed"
        (taskStausChanged)="onTaskStatusChange($event)"
        (deleted)="onTaskDeleted($event)"
      ></app-task-column>
    </div>
  } @else {
    <app-task-table [allTasks]="allTasks"></app-task-table>
  }
}
