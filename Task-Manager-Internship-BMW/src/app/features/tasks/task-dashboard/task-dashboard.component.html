@if (isLoading) {
  <div class="spinner-container">
    <mat-spinner diameter="60"></mat-spinner>
  </div>
} @else {
  <div class="top-bar">
    <h1>Task dashboard:</h1>
    <button
      class="circle-btn"
      aria-label="Create task"
      (click)="onCreateTaskClick()"
      matTooltip="Create a new task"
      matTooltipPosition="above"
    >Add Task</button>
  </div>

  <div class="filters">
    <app-task-filter-row
      filterName="Priority"
      [buttons]="priorities"
      [selectedValue]="selectedPriority"
      (selected)="onPrioritySelected($event)"
    ></app-task-filter-row>
    <app-task-filter-row
      filterName="Category"
      [buttons]="categories"
      [selectedValue]="selectedCategory"
      (selected)="onCategorySelected($event)"
    ></app-task-filter-row>
  </div>

  <div cdkDropListGroup class="columns">
    <app-task-column
      [cardItems]="todoTasks"
      title="To Do"
      (taskStausChanged)="onTaskStatusChange($event)"
      (deleted)="onTaskDeleted($event)"
    ></app-task-column>
    <app-task-column
      [cardItems]="inProgressTasks"
      title="In Progress"
      (taskStausChanged)="onTaskStatusChange($event)"
      (deleted)="onTaskDeleted($event)"
    ></app-task-column>
    <app-task-column
      [cardItems]="completedTasks"
      title="Completed"
      (taskStausChanged)="onTaskStatusChange($event)"
      (deleted)="onTaskDeleted($event)"
    ></app-task-column>
  </div>
}
