<h2 mat-dialog-title>Edit task</h2>

<form [formGroup]="taskForm" class="task-form">
  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" required />
      <mat-error *ngIf="taskForm.get('title')?.hasError('required') && taskForm.get('title')?.touched">
        Title is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Assignee</mat-label>
      <input matInput formControlName="assignee" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Due date</mat-label>
      <input matInput type="date" formControlName="dueDate" />
      <mat-error *ngIf="taskForm.get('dueDate')?.hasError('pastDate') && taskForm.get('dueDate')?.touched">
        Due date cannot be in the past.
      </mat-error>
      <mat-error *ngIf="taskForm.get('dueDate')?.hasError('invalidDate') && taskForm.get('dueDate')?.touched">
        Invalid date.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        <mat-option value="Low">Low</mat-option>
        <mat-option value="Medium">Medium</mat-option>
        <mat-option value="High">High</mat-option>
      </mat-select>
      <mat-error *ngIf="taskForm.get('priority')?.hasError('required') && taskForm.get('priority')?.touched">
        Priority is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="To Do">To Do</mat-option>
        <mat-option value="In Progress">In Progress</mat-option>
        <mat-option value="Completed">Completed</mat-option>
      </mat-select>
      <mat-error *ngIf="taskForm.get('status')?.hasError('required') && taskForm.get('status')?.touched">
        Status is required.
      </mat-error>
    </mat-form-field>

    <div class="section-block">
      <mat-label>Tags</mat-label>
      <div class="chip-row">
        <mat-form-field appearance="outline" class="inline-field">
          <input
            matInput
            #tagInput
            [value]="newTag"
            (input)="newTag = tagInput.value"
            placeholder="Add tag"
          />
        </mat-form-field>
        <button mat-stroked-button type="button" (click)="addTag()">Add</button>
      </div>
      <div class="chip-list">
        <span class="chip" *ngFor="let tag of task.tags" (click)="removeTag(tag)">#{{ tag }} ×</span>
      </div>
    </div>

    <div class="section-block">
      <mat-label>Subtasks</mat-label>
      <div class="chip-row">
        <mat-form-field appearance="outline" class="inline-field">
          <input
            matInput
            #subtaskInput
            [value]="newSubtaskTitle"
            (input)="newSubtaskTitle = subtaskInput.value"
            placeholder="New subtask"
          />
        </mat-form-field>
        <button mat-stroked-button type="button" (click)="addSubtask()">Add</button>
      </div>
      <div class="subtask-list" *ngFor="let subtask of task.subtasks">
        <div class="subtask-item">
          <span>{{ subtask.title }}</span>
          <button mat-icon-button type="button" (click)="removeSubtask(subtask)">×</button>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button color="warn" *ngIf="task.id" (click)="delete()">Delete</button>
    <button mat-button (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" type="button" (click)="save()">Save</button>
  </mat-dialog-actions>
</form>
